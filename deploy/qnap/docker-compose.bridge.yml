# NetDash — QNAP bridge (skan LAN)

# Import URL: https://raw.githubusercontent.com/lobrzut/netdash/main/deploy/qnap/docker-compose.bridge.yml

#

# !!! /24 skan = ryzyko crash całego QNAP. Używaj /28.

#

# Limity RAM/CPU — NIE w YAML (ostrzeżenia IDE; Container Station może ignorować klucze).

# Po deploy: Container Station → netdash → Resource → Memory 512 MB, CPU 50%.



services:

  netdash:

    image: ghcr.io/lobrzut/netdash:1.3.116

    container_name: netdash

    restart: always

    ports:

      - "18787:18787"

    environment:

      NETDASH_DEFAULT_ADMIN_USER: admin

      NETDASH_DEFAULT_ADMIN_PASSWORD: changeme

      NETDASH_SYNC_ADMIN_PASSWORD: "false"

      NETDASH_SCAN_CIDR: "192.168.1.144/28"

      NETDASH_SCAN_SAFE_MODE: "true"

      NETDASH_SCAN_SAFE_MAX_HOSTS: "16"

      NETDASH_SCAN_SAFE_CONCURRENCY: "2"

      NETDASH_SCAN_CHUNK_SIZE: "4"

      NETDASH_SCAN_BATCH_DELAY: "0.4"

      NETDASH_COOKIE_SECURE: "false"

      NETDASH_LISTEN_PORT: "18787"

    volumes:

      - /share/Container/netdash/data:/app/data

    cap_add:

      - NET_RAW

    labels:

      com.centurylinklabs.watchtower.enable: "true"

    healthcheck:

      test: ["CMD-SHELL", "curl -f http://127.0.0.1:18787/api/health || exit 1"]

      interval: 30s

      timeout: 10s

      retries: 3

      start_period: 40s


