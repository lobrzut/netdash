# NetDash + Watchtower — QNAP Container Station (jeden plik, auto-update)

# Import URL: https://raw.githubusercontent.com/lobrzut/netdash/main/deploy/qnap/docker-compose.full.yml

#

# Folder danych: /share/Container/netdash/data

# Portal: http://<IP-QNAP>:18787  (NETDASH_LISTEN_PORT; never 8787 — Readarr)

#

# QNAP: DOMYŚLNIE bridge + port 18787:18787 — host mode NIE skanuje LAN na QNAP.

# NETDASH_SCAN_CIDR jest WYMAGANY (dostosuj do swojej podsieci, np. 192.168.1.0/24).

#

# Watchtower co 24 h pobiera nowe obrazy z GHCR (etykieta watchtower.enable).

# Obraz PRZYPIĘTY semver — NIE :latest (QNAP CS cache'uje stary :latest bez entrypoint → crash 8787).

# Po starcie sprawdź logi: PIERWSZE linie MUSZĄ zawierać LISTEN_PORT=18787 i "NetDash entrypoint".

# Jeśli widzisz 8787 lub brak entrypoint → usuń aplikację CS, Pull ghcr.io/lobrzut/netdash:1.3.94, import od nowa.



services:

  netdash:

    image: ghcr.io/lobrzut/netdash:1.3.94

    container_name: netdash

    restart: always

    mem_limit: 512m

    cpus: 1.0

    ports:

      - "18787:18787"

    environment:

      # QNAP CS often ignores ${VAR:-default}; literals below work without CS env overrides.

      # NETDASH_SECRET_KEY: optional — entrypoint auto-generates to /app/data/.secret if unset.

      NETDASH_DEFAULT_ADMIN_USER: admin

      NETDASH_DEFAULT_ADMIN_PASSWORD: changeme

      # false = hasło w SQLite nie jest nadpisywane przy restarcie (pierwszy start tworzy admin/changeme).

      NETDASH_SYNC_ADMIN_PASSWORD: "false"

      # QNAP CS ignores ${VAR:-default} — literal CIDR required for LAN scan (bridge mode).

      NETDASH_SCAN_CIDR: "192.168.1.0/24"

      NETDASH_SCAN_SAFE_MODE: "true"

      NETDASH_COOKIE_SECURE: "false"

      # One-time recovery: odkomentuj, ustaw hasło, zaloguj, usuń env i zrestartuj.

      # NETDASH_RESET_ADMIN_PASSWORD: "twoje-haslo"

      # NETDASH_LISTEN_PORT only — never NETDASH_PORT (CS may persist 8787; entrypoint unsets it).

      NETDASH_LISTEN_PORT: "18787"

    volumes:

      - /share/Container/netdash/data:/app/data

    cap_add:

      - NET_RAW

    labels:

      com.centurylinklabs.watchtower.enable: "true"

    healthcheck:

      test: ["CMD-SHELL", "curl -f http://127.0.0.1:18787/api/health || exit 1"]

      interval: 30s

      timeout: 10s

      retries: 3

      start_period: 40s



  watchtower:

    image: containrrr/watchtower:1.7.1

    container_name: netdash-watchtower

    restart: unless-stopped

    volumes:

      - /var/run/docker.sock:/var/run/docker.sock

    environment:

      # QNAP CS ignoruje ${VAR:-default} — literały poniżej.

      WATCHTOWER_POLL_INTERVAL: "86400"

      WATCHTOWER_CLEANUP: "true"

      WATCHTOWER_LABEL_ENABLE: "true"

      WATCHTOWER_INCLUDE_RESTARTING: "true"

      WATCHTOWER_INCLUDE_STOPPED: "true"

      WATCHTOWER_ROLLING_RESTART: "true"


