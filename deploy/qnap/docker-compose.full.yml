# NetDash + Watchtower — QNAP Container Station

# Import URL: https://raw.githubusercontent.com/lobrzut/netdash/main/deploy/qnap/docker-compose.full.yml

#

# Discovery: lokalny skan WYŁĄCZONY — pełna sieć /24 z agenta na homelab (.201).

# Instalacja agenta: curl -fsSL .../deploy/agent/install.sh | NETDASH_PASSWORD=... bash

#

# Limity RAM/CPU — NIE w YAML (ostrzeżenia IDE; Container Station może ignorować klucze).

# Po deploy: Container Station → netdash → Resource → Memory 512 MB, CPU 50%.



services:

  netdash:

    image: ghcr.io/lobrzut/netdash:1.3.116

    container_name: netdash

    restart: always

    ports:

      - "18787:18787"

    environment:

      NETDASH_DEFAULT_ADMIN_USER: admin

      NETDASH_DEFAULT_ADMIN_PASSWORD: changeme

      NETDASH_SYNC_ADMIN_PASSWORD: "false"

      # Dashboard only — discovery via remote agent on homelab (.201)

      NETDASH_SCAN_DISABLED: "true"

      NETDASH_DISCOVERY_MODE: "remote"

      NETDASH_COOKIE_SECURE: "false"

      NETDASH_LISTEN_PORT: "18787"

    volumes:

      - /share/Container/netdash/data:/app/data

    cap_add:

      - NET_RAW

    labels:

      com.centurylinklabs.watchtower.enable: "true"

    healthcheck:

      test: ["CMD-SHELL", "curl -f http://127.0.0.1:18787/api/health || exit 1"]

      interval: 30s

      timeout: 10s

      retries: 3

      start_period: 40s



  watchtower:

    image: containrrr/watchtower:1.7.1

    container_name: netdash-watchtower

    restart: unless-stopped

    volumes:

      - /var/run/docker.sock:/var/run/docker.sock

    environment:

      WATCHTOWER_POLL_INTERVAL: "86400"

      WATCHTOWER_CLEANUP: "true"

      WATCHTOWER_LABEL_ENABLE: "true"

      WATCHTOWER_INCLUDE_RESTARTING: "true"

      WATCHTOWER_INCLUDE_STOPPED: "true"

      WATCHTOWER_ROLLING_RESTART: "true"


