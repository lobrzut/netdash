# NetDash + Watchtower — QNAP Container Station
# Import raz — auto-update przez Watchtower. NIE edytuj YAML na QNAP (CS nie pozwala).
# Jedyny plik do importu: wszystkie env, discovery, Watchtower — gotowe od pierwszego Start.
#
# Import URL:
#   https://raw.githubusercontent.com/lobrzut/netdash/main/deploy/qnap/docker-compose.full.yml
#
# Po imporcie: Start → http://<IP-QNAP>:18787 → admin/changeme → Ustawienia (CIDR, hasło).
# Aktualizacje: Watchtower co 1 h pobiera :latest z GHCR i restartuje NetDash.
# Obraz :latest (nie semver) — Watchtower porównuje digest tagu; pin 1.3.x nie auto-aktualizuje.

services:
  netdash:
    image: ghcr.io/lobrzut/netdash:latest
    container_name: netdash
    restart: always
    network_mode: host
    environment:
      NETDASH_DEFAULT_ADMIN_USER: admin
      NETDASH_DEFAULT_ADMIN_PASSWORD: changeme
      NETDASH_SYNC_ADMIN_PASSWORD: "false"
      NETDASH_DISCOVERY_MODE: "adaptive"
      NETDASH_DISCOVERY_PROFILE: "auto"
      NETDASH_SCAN_CIDR: "192.168.1.0/24"
      NETDASH_DISCOVERY_INTERVAL: "300"
      NETDASH_SCAN_SAFE_MODE: "true"
      NETDASH_DISCOVERY_PORT_PROBE: "true"
      NETDASH_STARTUP_HEALTH_DEFER: "true"
      NETDASH_DISCOVERY_STARTUP_DELAY: "60"
      NETDASH_COOKIE_SECURE: "false"
      NETDASH_LISTEN_PORT: "18787"
      NETDASH_WATCHTOWER_ENABLED: "true"
      NETDASH_WATCHTOWER_POLL_INTERVAL: "3600"
    volumes:
      - /share/Container/netdash/data:/app/data
    cap_add:
      - NET_RAW
      - NET_ADMIN
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:18787/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: netdash-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: "3600"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_INCLUDE_STOPPED: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
