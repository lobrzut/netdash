# NetDash + Watchtower — QNAP Container Station
# Import URL: https://raw.githubusercontent.com/lobrzut/netdash/main/deploy/qnap/docker-compose.full.yml
#
# Discovery: ARP na NAS (WatchYourLAN-style) — network_mode: host + arp-scan.
# Limity RAM/CPU — ustaw ręcznie w Container Station → Resource (512 MB, 50% CPU).

services:
  netdash:
    image: ghcr.io/lobrzut/netdash:1.3.117
    container_name: netdash
    restart: always
    network_mode: host
    environment:
      NETDASH_DEFAULT_ADMIN_USER: admin
      NETDASH_DEFAULT_ADMIN_PASSWORD: changeme
      NETDASH_SYNC_ADMIN_PASSWORD: "false"
      NETDASH_DISCOVERY_MODE: "arp"
      NETDASH_SCAN_CIDR: "192.168.1.0/24"
      NETDASH_ARP_INTERVAL: "300"
      NETDASH_SCAN_SAFE_MODE: "true"
      NETDASH_ARP_PROBE_NEW_HOSTS: "true"
      NETDASH_COOKIE_SECURE: "false"
      NETDASH_LISTEN_PORT: "18787"
    volumes:
      - /share/Container/netdash/data:/app/data
    cap_add:
      - NET_RAW
      - NET_ADMIN
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:18787/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: netdash-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: "86400"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_INCLUDE_STOPPED: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
