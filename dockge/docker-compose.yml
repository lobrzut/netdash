# Alias for Dockge — prefer compose.yaml in this folder.
# Stack root should be the repository root (/opt/stacks/netdash).
# See dockge/README.md and DEPRECATION-QNAP.md

services:
  netdash:
    image: ghcr.io/lobrzut/netdash:
    build:
      context: .
      args:
        NETDASH_BUILD_DATE: 
    container_name: netdash
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    network_mode: host
    env_file: .env
    environment:
      NETDASH_BUILD_DATE: 
      NETDASH_LISTEN_PORT: "18787"
      NETDASH_DEFAULT_ADMIN_USER: 
      NETDASH_DEFAULT_ADMIN_PASSWORD: 
      NETDASH_SYNC_ADMIN_PASSWORD: 
      NETDASH_SCAN_SAFE_MODE: 
      # Dedicated VM with spare CPU: NETDASH_SCAN_SAFE_MODE=false for full /24 scans
      # v1.3.140+: NETDASH_SCAN_ALL_PORTS=true — ~190 ports on live hosts (not for weak NAS)
    volumes:
      - ./data:/app/data
    cap_add:
      - NET_RAW
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:18787/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: netdash-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: 
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
