# Alias for Dockge / docker compose -f dockge/docker-compose.yml
# Prefer compose.yaml in this folder (Dockge default filename).
# See dockge/README.md and ../DEPLOYMENT.md

services:
  netdash:
    build:
      context: .
      args:
        NETDASH_BUILD_DATE: ${NETDASH_BUILD_DATE:-}
    container_name: netdash
    restart: always
    network_mode: host
    env_file: .env
    environment:
      NETDASH_BUILD_DATE: ${NETDASH_BUILD_DATE:-}
    volumes:
      # SQLite (netdash.db) + uploaded icons/logos (data/uploads/)
      - ./data:/app/data
    cap_add:
      - NET_RAW
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
