# NetDash — Dockge / Proxmox Ubuntu VM (standard Linux deploy)
# Repository: https://github.com/lobrzut/netdash
#
# Deploy (stack root = cloned repo, e.g. /opt/stacks/netdash):
#   git clone https://github.com/lobrzut/netdash.git /opt/stacks/netdash
#   cd /opt/stacks/netdash && cp .env.example .env   # edit secrets
#   docker compose -f dockge/compose.yaml up -d
#
# Dockge: clone to stacks dir → Scan Stacks Folder → deploy stack "netdash"
# Optional: cp dockge/compose.yaml compose.yaml  (Dockge default filename at stack root)
#
# GHCR image (no local build):
#   docker compose -f dockge/compose.yaml pull && docker compose -f dockge/compose.yaml up -d
#
# Auto-update: Watchtower starts with every `docker compose up -d`.
# Only containers with label com.centurylinklabs.watchtower.enable=true are updated (netdash).
# To update ALL containers on this host, set WATCHTOWER_LABEL_ENABLE=false on watchtower.
#
# Linux host only: network_mode: host is required for LAN scan.
# Do NOT add ports: — Docker refuses host network + port mapping.

services:
  netdash:
    image: ghcr.io/lobrzut/netdash:${NETDASH_IMAGE_TAG:-latest}
    build:
      context: .
      args:
        NETDASH_BUILD_DATE: ${NETDASH_BUILD_DATE:-}
    container_name: netdash
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M  # 2 GB Proxmox VM: leave headroom for OS + Docker + Dockge (1024M caused OOM on 2 GB hosts)
          cpus: "1.0"
    network_mode: host
    env_file: .env
    environment:
      NETDASH_BUILD_DATE: ${NETDASH_BUILD_DATE:-}
      NETDASH_LISTEN_PORT: "18787"
      # ULTRA-SAFE 2 GB VM defaults — discovery OFF until you opt in via .env
      NETDASH_DISCOVERY_ENABLED: ${NETDASH_DISCOVERY_ENABLED:-false}
      NETDASH_DISCOVERY_MODE: ${NETDASH_DISCOVERY_MODE:-adaptive}
      NETDASH_DISCOVERY_PROFILE: ${NETDASH_DISCOVERY_PROFILE:-weak}
      NETDASH_DISCOVERY_INTERVAL: ${NETDASH_DISCOVERY_INTERVAL:-900}
      NETDASH_DISCOVERY_STARTUP_DELAY: ${NETDASH_DISCOVERY_STARTUP_DELAY:-300}
      NETDASH_STARTUP_ENRICH_ENABLED: ${NETDASH_STARTUP_ENRICH_ENABLED:-false}
      NETDASH_WEAK_DUAL_CHUNK: ${NETDASH_WEAK_DUAL_CHUNK:-false}
      NETDASH_DEFAULT_ADMIN_USER: ${NETDASH_DEFAULT_ADMIN_USER:-admin}
      NETDASH_DEFAULT_ADMIN_PASSWORD: ${NETDASH_DEFAULT_ADMIN_PASSWORD:-changeme}
      NETDASH_SYNC_ADMIN_PASSWORD: ${NETDASH_SYNC_ADMIN_PASSWORD:-true}
      NETDASH_SCAN_SAFE_MODE: ${NETDASH_SCAN_SAFE_MODE:-true}
      NETDASH_AUTO_DISCOVERY_ALL_PORTS: ${NETDASH_AUTO_DISCOVERY_ALL_PORTS:-false}
      NETDASH_AUTO_DISCOVERY_ALWAYS_CHUNK: ${NETDASH_AUTO_DISCOVERY_ALWAYS_CHUNK:-true}
      # Set LAN in .env: NETDASH_SCAN_CIDR=192.168.1.0/24 (or UI → Automatic discovery)
      # Keep SCAN_SAFE_MODE=true on shared VLANs — manual /24 with false can overload the network
      # Always-on homelab hosts outside current /28 chunk (e.g. Proxmox):
      # NETDASH_ARP_EXTRA_HOSTS: "192.168.1.200"
      # Manual scan only: NETDASH_SCAN_ALL_PORTS=true (heavier than auto gradual probe)
    volumes:
      - ./data:/app/data
    cap_add:
      - NET_RAW
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:18787/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: netdash-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-86400}
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
