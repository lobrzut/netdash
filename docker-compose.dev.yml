# Opcjonalny profil: test Dockera lokalnie (bridge, bez network_mode: host).
# Słaby sprzęt: deploy.resources 1024M/1 CPU, safe mode domyślnie true, CIDR /28.
# Skan LAN wymaga NETDASH_SCAN_CIDR — ustaw w .env lub w panelu Ustawienia.
# Użycie: docker compose -f docker-compose.dev.yml up -d --build

services:
  netdash:
    build: .
    container_name: netdash-dev
    restart: unless-stopped
    ports:
      - "18787:18787"
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
    environment:
      NETDASH_SECRET_KEY: ${NETDASH_SECRET_KEY:?Set NETDASH_SECRET_KEY in .env}
      NETDASH_DEFAULT_ADMIN_USER: ${NETDASH_DEFAULT_ADMIN_USER:-admin}
      NETDASH_DEFAULT_ADMIN_PASSWORD: ${NETDASH_DEFAULT_ADMIN_PASSWORD:?Set NETDASH_DEFAULT_ADMIN_PASSWORD in .env}
      NETDASH_SYNC_ADMIN_PASSWORD: ${NETDASH_SYNC_ADMIN_PASSWORD:-true}
      NETDASH_BUILD_DATE: ${NETDASH_BUILD_DATE:-}
      NETDASH_SCAN_CIDR: ${NETDASH_SCAN_CIDR:-192.168.1.0/28}
      NETDASH_SCAN_SAFE_MODE: ${NETDASH_SCAN_SAFE_MODE:-true}
      NETDASH_LISTEN_PORT: "18787"
    cap_add:
      - NET_RAW
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:18787/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
