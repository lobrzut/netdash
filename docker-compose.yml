# NetDash — production (Linux, network_mode: host)
# Image from GHCR (GitHub Actions) or local build:
#   pull:  docker compose pull && docker compose up -d
#   build: docker compose up -d --build
# Auto-update (opt-in): docker compose --profile auto-update up -d
# See docs/QNAP.md and DEPLOYMENT.md

services:
  netdash:
    image: ghcr.io/lobrzut/netdash:${NETDASH_IMAGE_TAG:-latest}
    build:
      context: .
      args:
        NETDASH_BUILD_DATE: ${NETDASH_BUILD_DATE:-}
    container_name: netdash
    restart: always
    # Słaby sprzęt homelab: limit RAM/CPU — skan LAN nie może zagłodzić hosta.
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
    network_mode: host
    env_file: .env
    environment:
      NETDASH_BUILD_DATE: ${NETDASH_BUILD_DATE:-}
      NETDASH_LISTEN_PORT: "18787"
      NETDASH_DEFAULT_ADMIN_PASSWORD: ${NETDASH_DEFAULT_ADMIN_PASSWORD:-changeme}
      NETDASH_DEFAULT_ADMIN_USER: ${NETDASH_DEFAULT_ADMIN_USER:-admin}
      NETDASH_SYNC_ADMIN_PASSWORD: ${NETDASH_SYNC_ADMIN_PASSWORD:-true}
      # Safe scan default — set false only on powerful hosts (see README „Słaby sprzęt”).
      NETDASH_SCAN_SAFE_MODE: ${NETDASH_SCAN_SAFE_MODE:-true}
    volumes:
      - ./data:/app/data
      # Optional: enable in-app "Update now" (security risk — see docs/QNAP.md)
      # - /var/run/docker.sock:/var/run/docker.sock
    cap_add:
      - NET_RAW
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:18787/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: netdash-watchtower
    restart: unless-stopped
    profiles:
      - auto-update
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-86400}
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
