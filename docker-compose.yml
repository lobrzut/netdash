services:
  netdash:
    build:
      context: .
      args:
        NETDASH_BUILD_DATE: ${NETDASH_BUILD_DATE:-}
    container_name: netdash
    restart: always
    # Przy network_mode: host sekcja ports jest niedozwolona (Docker odmawia startu).
    # Na Windows/Mac zakomentuj host poniżej i odkomentuj ports.
    # ports:
    #   - "8787:8787"
    network_mode: host
    env_file: .env
    volumes:
      - ./data:/app/data
    cap_add:
      - NET_RAW
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
